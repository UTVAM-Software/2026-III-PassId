{% extends "base.html" %}

{% block content %}
<div class="container-fluid mt-4">
    <!-- Encabezado con Título y Botones -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h3 mb-0 text-gray-800">{{ page_title }}</h2>
        </div>
        <div>
            {% if update_url %}
            <a href="{{ update_url }}" class="btn btn-primary">
                <i class="fas fa-edit"></i> Editar
            </a>
            {% endif %}
            {% if list_url %}
            <a href="{{ list_url }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Regresar a la lista
            </a>
            {% endif %}
        </div>
    </div>

    <!-- Tarjeta de Contenido -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Información Detallada</h6>
        </div>
        <div class="card-body">
            <!-- Bloque donde se inyectarán los datos de cada modelo -->
            {% block detail_content %}
            {% endblock detail_content %}
        </div>
    </div>
</div>
{% endblock content %}
