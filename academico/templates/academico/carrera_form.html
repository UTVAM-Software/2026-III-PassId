{% extends 'common/form_base.html' %}

{% block form_fields %}
<div class="grid-2">
    <div class="form-group">
        <label class="form-label" for="{{ form.clave.id_for_label }}">{{ form.clave.label }}</label>
        {{ form.clave }}
        {% for error in form.clave.errors %}
        <p style="color: #f87171; font-size: 0.85rem; margin-top: 0.25rem;">{{ error }}</p>
        {% endfor %}
    </div>
    <div class="form-group">
        <label class="form-label" for="{{ form.nombre.id_for_label }}">{{ form.nombre.label }}</label>
        {{ form.nombre }}
        {% for error in form.nombre.errors %}
        <p style="color: #f87171; font-size: 0.85rem; margin-top: 0.25rem;">{{ error }}</p>
        {% endfor %}
    </div>
</div>

<div class="form-group" style="margin-top: 1rem;">
    <label class="checkbox-item">
        {{ form.activa }} {{ form.activa.label }}
    </label>
</div>
{% endblock %}
